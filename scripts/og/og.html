<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Hanken'; font-weight: 100 900; src: url('../../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); }
  :root { --fundo: #f4f4f1; --fundo-2: #e9e9e4; --texto: #0b0c0e; --texto-2: #50545c; --verde: #2e6b55; --regua: rgb(11 12 14 / 0.12); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Hanken', sans-serif; background: var(--fundo); color: var(--texto); position: relative; -webkit-font-smoothing: antialiased; }
  .coluna { position: absolute; left: 72px; top: 64px; bottom: 52px; width: 590px; display: flex; flex-direction: column; }
  .marca { display: flex; align-items: center; gap: 14px; color: var(--verde); font-size: 30px; font-weight: 400; letter-spacing: -0.01em; }
  .marca svg { width: 58px; height: auto; }
  h1 { margin-top: auto; font-size: 76px; line-height: 1.0; font-weight: 300; letter-spacing: -0.045em; }
  h1 b { font-weight: 500; color: var(--verde); }
  .apoio { margin-top: 32px; width: 520px; font-size: 25px; line-height: 1.35; color: var(--texto-2); }
  .rodape { margin-top: auto; display: flex; gap: 12px; align-items: center; font-size: 21px; color: var(--texto-2); }
  .rodape i { width: 10px; height: 10px; border-radius: 50%; background: var(--verde); }
  .painel { position: absolute; right: 48px; top: 48px; width: 470px; height: 534px; border-radius: 28px; background: var(--fundo-2); }
  .painel svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="coluna">
  <div class="marca">
    <svg viewBox="480 470 930 680" fill="none" stroke="currentColor" stroke-width="48" aria-hidden="true">
      <path d="M512 848 C650 702 955 628 1165 765"/><path d="M1325 668 C1290 820 1150 960 958 985"/><path d="M828 962 C860 1050 920 1100 1000 1108"/>
      <path fill="currentColor" stroke="none" fill-rule="evenodd" d="M826 648 C880 568 955 520 1045 497 C1028 570 1035 635 1080 688 L826 648 Z M890 645 C925 610 955 588 985 573 C988 610 993 637 1003 660 Z"/>
      <circle cx="713" cy="820" r="35" fill="currentColor" stroke="none"/><circle cx="1320" cy="928" r="57" fill="currentColor" stroke="none"/>
    </svg>
    <span>carpe labs</span>
  </div>
  <h1 id="titulo"></h1>
  <p class="apoio" id="apoio"></p>
  <p class="rodape"><i></i><span id="rodape"></span></p>
  </div>
  <div class="painel"><svg id="fluxo" viewBox="0 0 470 534"></svg></div>
<script>
  const en = location.search.includes('en');
  const t = en
    ? { titulo: 'We put <b>AI</b> to work in your operation.', apoio: 'AI assistants on top of the system your company already uses.', rodape: 'carpelabs.io · In use at Nipo Center', fontes: ['Excel', 'Email', 'PDF', 'Management system', 'Word', 'PowerPoint'], saida: 'Answers and tasks', ia: 'AI' }
    : { titulo: 'Colocamos a <b>IA</b> para trabalhar na sua operação.', apoio: 'Assistentes de IA em cima do sistema que a sua empresa já usa.', rodape: 'carpelabs.io · Em uso na Nipo Center', fontes: ['Excel', 'E-mail', 'PDF', 'Sistema de gestão', 'Word', 'PowerPoint'], saida: 'Respostas e tarefas', ia: 'IA' };
  document.documentElement.lang = en ? 'en' : 'pt-BR';
  titulo.innerHTML = t.titulo; apoio.textContent = t.apoio; rodape.textContent = t.rodape;
  // Mesmo desenho do #fluxo da página, em miniatura: três fontes de cada lado entram na IA.
  const cores = ['#1f7a4d', '#0f84c8', '#d33b32', '#6b4fbb', '#2b5fb4', '#d0542b'];
  const c = { x: 235, y: 230, r: 54 };
  let s = '';
  t.fontes.forEach((nome, i) => {
    const esq = i < 3, y = [90, 230, 370][i % 3], w = 136;
    const bx = esq ? 20 : 470 - 20 - w, borda = esq ? bx + w : bx;
    const meio = esq ? 182 : 288, fim = esq ? c.x - c.r - 2 : c.x + c.r + 2;
    s += `<path d="M${borda},${y} C${meio},${y} ${meio},${c.y} ${fim},${c.y}" stroke="#2e6b55" stroke-opacity=".45" stroke-width="2" fill="none"/>`;
    s += `<rect x="${bx}" y="${y - 24}" width="${w}" height="48" rx="12" fill="#f4f4f1" stroke="rgb(11 12 14 / .14)"/>`;
    s += `<rect x="${bx + 12}" y="${y - 11}" width="22" height="22" rx="6" fill="${cores[i]}"/>`;
    s += `<text x="${bx + 42}" y="${y + 5}" font-size="${nome.length > 14 ? 12 : nome.length > 10 ? 13.5 : 16}" font-weight="500" fill="#0b0c0e">${nome}</text>`;
  });
  s += `<circle cx="${c.x}" cy="${c.y}" r="${c.r + 16}" fill="none" stroke="#2e6b55" stroke-opacity=".35" stroke-dasharray="4 7" stroke-width="2"/>`;
  s += `<circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="#2e6b55"/>`;
  s += `<text x="${c.x}" y="${c.y + 14}" text-anchor="middle" font-size="42" font-weight="500" fill="#fff">${t.ia}</text>`;
  s += `<path d="M${c.x},${c.y + c.r + 2} L${c.x},440" stroke="#2e6b55" stroke-opacity=".45" stroke-width="2"/>`;
  s += `<rect x="${c.x - 115}" y="440" width="230" height="52" rx="26" fill="#0b0c0e"/>`;
  s += `<text x="${c.x}" y="472" text-anchor="middle" font-size="18" font-weight="500" fill="#f4f4f1">${t.saida}</text>`;
  fluxo.innerHTML = s;
  fluxo.style.fontFamily = 'Hanken';
</script>
